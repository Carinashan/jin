<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d14">
<meta name="description" content="合成大静子 · 表情包版 —— 把静子的表情包合成一个更大的静子">
<title>合成大静子 · 表情包版</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%8D%89%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0b0d14; --fg:#eef1f8; --muted:#98a0b8;
    --panel:rgba(255,255,255,.06); --line:rgba(255,255,255,.12);
    --accent:#63e6be;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:radial-gradient(1100px 760px at 50% -12%, #1d2748 0%, #0d1018 52%, #06070c 100%);
    color:var(--fg); overflow:hidden; -webkit-tap-highlight-color:transparent;
    user-select:none; -webkit-user-select:none;
    font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  .app{height:100vh; height:100dvh; display:flex; flex-direction:column; align-items:center;
       gap:8px; padding:10px 12px 12px}
  .hud{width:100%; max-width:600px; display:flex; align-items:center; gap:10px}
  .brand{display:flex; align-items:center; gap:8px; min-width:0}
  .brand .logo{font-size:22px; line-height:1; filter:drop-shadow(0 3px 8px rgba(99,230,190,.35))}
  .brand h1{font-size:16px; margin:0; font-weight:700; letter-spacing:.5px; white-space:nowrap}
  .brand h1 small{font-weight:500; font-size:11px; color:var(--muted); margin-left:4px}
  .spacer{flex:1 1 auto}
  .stats{display:flex; gap:8px}
  .stat{background:var(--panel); border:1px solid var(--line); border-radius:12px;
        padding:5px 10px; min-width:74px; text-align:center; backdrop-filter:blur(6px)}
  .stat .k{display:block; font-size:10px; color:var(--muted); letter-spacing:1px}
  .stat b{font-size:19px; font-variant-numeric:tabular-nums; line-height:1.15}
  .nextbox{display:flex; flex-direction:column; align-items:center; gap:2px}
  .nextbox .k{font-size:10px; color:var(--muted); letter-spacing:1px}
  .nextring{width:48px; height:48px; border-radius:50%; display:grid; place-items:center;
            background:var(--panel); border:2px solid #ff5d73; overflow:hidden;
            box-shadow:0 0 0 3px rgba(255,255,255,.04)}
  .nextring img{width:100%; height:100%; object-fit:cover; display:block}

  .stage{position:relative; flex:1 1 auto; min-height:0; width:100%; display:flex;
         align-items:center; justify-content:center}
  canvas{display:block; touch-action:none; border-radius:16px;
         box-shadow:0 24px 70px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.07)}

  .foot{width:100%; max-width:600px; display:flex; align-items:center; gap:8px}
  .tips{flex:1 1 auto; font-size:11.5px; color:var(--muted); line-height:1.35}
  .foot button{
    appearance:none; border:1px solid var(--line); background:var(--panel); color:var(--fg);
    border-radius:11px; padding:7px 11px; font-size:12.5px; cursor:pointer; white-space:nowrap;
    transition:transform .08s ease, background .15s ease;
  }
  .foot button:hover{background:rgba(255,255,255,.12)}
  .foot button:active{transform:scale(.96)}

  .overlay{position:absolute; inset:0; display:grid; place-items:center; padding:18px;
           background:rgba(6,8,14,.72); backdrop-filter:blur(7px); border-radius:16px;
           opacity:0; pointer-events:none; transition:opacity .28s ease}
  .overlay.on{opacity:1; pointer-events:auto}
  .card{width:min(340px,100%); background:linear-gradient(180deg,rgba(32,38,60,.96),rgba(16,19,30,.96));
        border:1px solid var(--line); border-radius:18px; padding:20px 20px 18px; text-align:center;
        box-shadow:0 24px 60px rgba(0,0,0,.6); transform:translateY(8px) scale(.97); transition:transform .28s ease}
  .overlay.on .card{transform:none}
  .card h2{margin:0 0 2px; font-size:21px}
  .card .sub{color:var(--muted); font-size:12.5px; margin-bottom:14px}
  .rows{display:flex; gap:10px; margin-bottom:16px}
  .rows div{flex:1; background:rgba(255,255,255,.05); border:1px solid var(--line);
            border-radius:12px; padding:9px 6px}
  .rows .k{display:block; font-size:10.5px; color:var(--muted); letter-spacing:1px}
  .rows b{font-size:21px; font-variant-numeric:tabular-nums}
  .card button{width:100%; appearance:none; border:0; cursor:pointer; border-radius:13px;
               padding:12px; font-size:15px; font-weight:700; color:#06231c;
               background:linear-gradient(180deg,#7df3cd,#37c9a0); box-shadow:0 10px 24px rgba(55,201,160,.28)}
  .card button:active{transform:scale(.98)}
  .best-line{margin-top:10px; font-size:11.5px; color:var(--muted)}
  @media (max-width:380px){ .brand h1 small{display:none} .stat{min-width:64px} }
</style>
</head>
<body>
<div class="app">
  <header class="hud">
    <div class="brand"><span class="logo">🍉</span><h1>合成大静子<small>表情包版</small></h1></div>
    <div class="spacer"></div>
    <div class="stats">
      <div class="stat"><span class="k">分数</span><b id="score">0</b></div>
      <div class="stat"><span class="k">最高</span><b id="best">0</b></div>
    </div>
    <div class="nextbox"><span class="k">NEXT</span><span class="nextring" id="nextring"><img id="nextimg" alt="下一个"></span></div>
  </header>

  <main class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="overlay" id="overlay">
      <div class="card">
        <h2 id="ovTitle">游戏结束</h2>
        <div class="sub" id="ovSub">静子的表情包堆到顶啦</div>
        <div class="rows">
          <div><span class="k">本局分数</span><b id="ovScore">0</b></div>
          <div><span class="k">最大表情</span><b id="ovMax">-</b></div>
          <div><span class="k">合成次数</span><b id="ovMerge">0</b></div>
        </div>
        <button id="ovBtn">再来一局</button>
        <div class="best-line" id="ovBest">历史最高：0</div>
      </div>
    </div>
  </main>

  <footer class="foot">
    <div class="tips" id="tips">拖动瞄准 · 松手投放&nbsp;|&nbsp;电脑：移动鼠标 + 点击，或用 ← → 和空格</div>
    <button id="btnSound">🔊 音效</button>
    <button id="btnRestart">↻ 重开</button>
  </footer>
</div>

  { r: 136, img: 0, hue: 300, ring: '#34d399', score: 200 }
];
var MAX_LV = LEVELS.length - 1;

/* ============================== 物理内核（无 DOM 依赖） ============================== */
/* ==PHYSICS-START== */
function createWorld(cfg){
  var WL = cfg.W, HL = cfg.H, DANGER = cfg.dangerY, INS = cfg.inset;
  var G = cfg.gravity, LV = cfg.levels;
  var SUB = 6;              // 每帧子步数
  var REST = 0.06;          // 法向恢复系数
  var FRIC = 0.32;          // 切向摩擦系数
  var SLOP = 0.35;          // 允许的微穿透
  var MAXV = 2600;          // 速度上限（防穿透）
  var idc = 0;

  var st = {
    bodies: [], events: [], time: 0, over: false, danger: false,
    dangerTimer: 0, score: 0, maxLevel: 0, merges: 0, combo: 0, comboTimer: 0
  };

  function add(level, x, y, vx, vy){
    var r = LV[level].r;
    var b = {
      id: ++idc, level: level, r: r,
      x: x, y: y, vx: vx || 0, vy: vy || 0,
      m: r * r, inv: 1 / (r * r),
      angle: 0, spin: 0, age: 0, pop: 0, dead: false
    };
    st.bodies.push(b);
    return b;
  }

  function integrate(h){
    var bs = st.bodies, i, b;
    for (i = 0; i < bs.length; i++){
      b = bs[i];
      if (b.dead) continue;
      b.vy += G * h;
      if (b.vy > MAXV) b.vy = MAXV;
      b.x += b.vx * h; b.y += b.vy * h;
      b.angle += b.spin * h;
      b.spin *= 0.995;
      b.age += h;
      if (b.pop > 0) b.pop = Math.max(0, b.pop - h);
      // 静止时缓慢摆正，让表情不至于一直倒着
      if (Math.abs(b.spin) < 1.8 && Math.abs(b.vx) < 60 && Math.abs(b.vy) < 60){
        var k = Math.PI * 2;
        b.angle += (Math.round(b.angle / k) * k - b.angle) * Math.min(0.22, 3 * h);
      }
    }
  }

  function walls(){
    var bs = st.bodies, i, b;
    for (i = 0; i < bs.length; i++){
      b = bs[i];
      if (b.dead) continue;
      if (b.x - b.r < INS){ b.x = INS + b.r; if (b.vx < 0) b.vx = -b.vx * REST; b.vy *= 0.995; }
      if (b.x + b.r > WL - INS){ b.x = WL - INS - b.r; if (b.vx > 0) b.vx = -b.vx * REST; b.vy *= 0.995; }
      if (b.y + b.r > HL - INS){
        b.y = HL - INS - b.r;
        if (b.vy > 0) b.vy = -b.vy * REST;
        b.vx *= 0.98; b.spin *= 0.94;
        if (Math.abs(b.vy) < 24) b.vy = 0;      // 抑制地面微弹跳
      }
      if (b.y - b.r < -HL){ b.y = -HL + b.r; if (b.vy < 0) b.vy = 0; }
    }
  }

  function clampPos(b){
    if (b.x - b.r < INS) b.x = INS + b.r;
    else if (b.x + b.r > WL - INS) b.x = WL - INS - b.r;
    if (b.y + b.r > HL - INS) b.y = HL - INS - b.r;
  }

  function pairPass(){
    var bs = st.bodies, n = bs.length, i, j, a, b;
    var merges = null;
    for (i = 0; i < n; i++){
      a = bs[i];
      if (a.dead) continue;
      for (j = i + 1; j < n; j++){
        b = bs[j];
        if (b.dead) continue;
        var dx = b.x - a.x, dy = b.y - a.y;
        var rr = a.r + b.r;
        var d2 = dx * dx + dy * dy;
        if (d2 > rr * rr) continue;
        if (a.level === b.level){                       // 同级相撞 → 合成
          a.dead = true; b.dead = true;
          if (!merges) merges = [];
          merges.push([a, b]);
          break;                                        // 一个球一帧只能参与一次合成
        }
        var d = Math.sqrt(d2);
        if (d < 0.0001){ d = 0.0001; dx = 0.0001; dy = 0; }
        var nx = dx / d, ny = dy / d;
        var pen = rr - d;
        var invSum = a.inv + b.inv;
        var corr = Math.max(pen - SLOP, 0) * 0.75;
        var ca = corr * (a.inv / invSum), cb = corr * (b.inv / invSum);
        a.x -= nx * ca; a.y -= ny * ca;
        b.x += nx * cb; b.y += ny * cb;
        clampPos(a); clampPos(b);

        var rvx = b.vx - a.vx, rvy = b.vy - a.vy;
        var vn = rvx * nx + rvy * ny;
        if (vn < 0){
          var e = pen > 8 ? 0.02 : 0.05;
          var jn = -(1 + e) * vn / invSum;
          a.vx -= nx * jn * a.inv; a.vy -= ny * jn * a.inv;
          b.vx += nx * jn * b.inv; b.vy += ny * jn * b.inv;

          var tx = -ny, ty = nx;
          var vt = rvx * tx + rvy * ty;
          var jt = -vt / invSum * FRIC;
          var cap = jn * 0.7;
          if (jt > cap) jt = cap; else if (jt < -cap) jt = -cap;
          a.vx -= tx * jt * a.inv; a.vy -= ty * jt * a.inv;
          b.vx += tx * jt * b.inv; b.vy += ty * jt * b.inv;
          // 滚动耦合：让表情包滚起来
          a.spin += (-vt / Math.max(a.r, 1) * 0.5 - a.spin) * 0.10;
          b.spin += ( vt / Math.max(b.r, 1) * 0.5 - b.spin) * 0.10;
        }
      }
    }
    if (merges){
      for (i = 0; i < merges.length; i++) doMerge(merges[i][0], merges[i][1]);
    }
  }

  function doMerge(a, b){
    var maxIdx = LV.length - 1;
    var nl = a.level + 1;
    var mx = (a.x + b.x) * 0.5, my = (a.y + b.y) * 0.5;
    var msum = a.m + b.m;
    var vx = (a.vx * a.m + b.vx * b.m) / msum * 0.45;
    var vy = (a.vy * a.m + b.vy * b.m) / msum * 0.45;
    st.combo++; st.comboTimer = 0.85;
    st.merges++;
    if (nl > maxIdx){
      // 两个最大的已合体 → 它们一起消失 + 巨额奖励
      st.score += 500;
      st.maxLevel = maxIdx;
      st.events.push({ type: 'bigwin', level: maxIdx, x: mx, y: my, score: 500, combo: st.combo, done: false });
      return;
    }
    var pts = Math.round(LV[nl].score * (1 + (st.combo - 1) * 0.5));
    st.score += pts;
    if (nl > st.maxLevel) st.maxLevel = nl;
    st.events.push({ type: 'merge', level: nl, x: mx, y: my, score: pts, combo: st.combo, done: false });
    var nb = add(nl, mx, my, vx, vy);
    nb.pop = 0.3;
  }

  function step(dt){
    if (st.over) return;
    var h = dt / SUB, s;
    for (s = 0; s < SUB; s++){
      integrate(h);
      walls();
      pairPass();
    }
    st.time += dt;
    if (st.comboTimer > 0){
      st.comboTimer -= dt;
      if (st.comboTimer <= 0) st.combo = 0;
    }
    // 死亡判定：有表情在死亡线以上停住了
    var danger = false, bs = st.bodies, i, b;
    for (i = 0; i < bs.length; i++){
      b = bs[i];
      if (b.dead) continue;
      if (b.age > 1.1 && (b.y - b.r) < DANGER && Math.abs(b.vy) < 160 && Math.abs(b.vx) < 160){
        danger = true; break;
      }
    }
    st.danger = danger;
    if (danger) st.dangerTimer += dt;
    else st.dangerTimer = Math.max(0, st.dangerTimer - dt * 2.5);
    if (st.dangerTimer > 1.8 && !st.over){
      st.over = true;
      st.events.push({ type: 'gameover', done: false });
    }
    if (st.over) return;
    // 清理已合成的球
    var out = [], live = st.bodies;
    for (i = 0; i < live.length; i++) if (!live[i].dead) out.push(live[i]);
    st.bodies = out;
  }

  function reset(){
    st.bodies = []; st.events = []; st.time = 0; st.over = false; st.danger = false;
    st.dangerTimer = 0; st.score = 0; st.maxLevel = 0; st.merges = 0; st.combo = 0; st.comboTimer = 0;
  }

  return { W: WL, H: HL, state: st, add: add, step: step, reset: reset, LEVELS: LV };
}
/* ==PHYSICS-END== */

/* ============================== 精灵预渲染 ============================== */
var sprites = [];      // 每关一张离屏画布（圆形遮罩 + 色相偏移）
var faces = [];        // 原始 5 张图片

function makeSprite(img, hue){
  var S = 256;
  var c = document.createElement('canvas');
  c.width = c.height = S;
  var g = c.getContext('2d');
  g.save();
  g.beginPath(); g.arc(S / 2, S / 2, S / 2 - 1, 0, Math.PI * 2); g.clip();
  g.fillStyle = '#20242e'; g.fillRect(0, 0, S, S);
  if (hue){
    try { g.filter = 'hue-rotate(' + hue + 'deg) saturate(1.1)'; } catch (err){}
    if (g.filter === undefined || g.filter === 'none'){ g.filter = ''; }
  }
  // 轻微放大，避免圆形边缘露出背景
  var k = 1.06, dw = S * k, dh = S * k;
  g.drawImage(img, (S - dw) / 2, (S - dh) / 2, dw, dh);
  g.filter = 'none';
  g.restore();
  return c;
}

/* ============================== 音效 ============================== */
var Sound = (function(){
  var actx = null, on = true;
  function ctx(){
    if (!actx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) actx = new AC();
    }
    if (actx && actx.state === 'suspended') actx.resume();
    return actx;
  }
  function tone(f0, f1, dur, type, vol, delay){
    if (!on) return;
    var a = ctx(); if (!a) return;
    var t0 = a.currentTime + (delay || 0);
    var o = a.createOscillator(), g = a.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f0, t0);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(40, f1), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t0); o.stop(t0 + dur + 0.03);
  }
  return {
    unlock: function(){ ctx(); },
    toggle: function(){
      on = !on;
      try { localStorage.setItem('suika-face-sound', on ? '1' : '0'); } catch (err){}
      if (on) tone(660, 880, 0.1, 'sine', 0.06);
      return on;
    },
    set: function(v){ on = !!v; },
    isOn: function(){ return on; },
    drop: function(){ tone(200, 120, 0.09, 'triangle', 0.05); },
    merge: function(lv){
      var f = 280 * Math.pow(1.13, lv);
      tone(f, f * 1.7, 0.16, 'sine', 0.075);
      tone(f * 2, f * 2.8, 0.1, 'triangle', 0.03, 0.02);
    },
    big: function(){
      [523, 659, 784, 1046].forEach(function(f, i){ tone(f, f * 1.02, 0.26, 'sine', 0.075, i * 0.09); });
    },
    over: function(){
      [440, 349, 262, 196].forEach(function(f, i){ tone(f, f * 0.96, 0.3, 'sawtooth', 0.05, i * 0.13); });
    }
  };
})();

/* ============================== 游戏状态 ============================== */
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var stage = document.getElementById('stage');
var elScore = document.getElementById('score');
var elBest = document.getElementById('best');
var elNextImg = document.getElementById('nextimg');
var elNextRing = document.getElementById('nextring');
var overlay = document.getElementById('overlay');

var world = createWorld({ W: W, H: H, dangerY: DANGER_Y, inset: INSET, gravity: 2400, levels: LEVELS });
var held = null;               // { level, x }
var nextLevel = 0;
var cooldown = 0;
var paused = false;
var aimX = W / 2;
var pointerType = 'mouse';
var dragging = false;
var shake = 0;
var parts = [];                // 粒子
var texts = [];                // 飘字
var rings = [];                // 合成冲击波
var time = 0;
var best = 0;

try { best = parseInt(localStorage.getItem('suika-face-best') || '0', 10) || 0; } catch (e){ best = 0; }
elBest.textContent = best;

function randLevel(){
  var pool = [0, 0, 0, 1, 1, 1, 2, 2, 3, 3, 4];   // 小表情出现概率更高
  return pool[(Math.random() * pool.length) | 0];
}
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }

function updateNextUI(){
  var L = LEVELS[nextLevel];
  elNextImg.src = SPRITE_DATA[L.img];
  elNextImg.style.filter = L.hue ? 'hue-rotate(' + L.hue + 'deg) saturate(1.1)' : '';
  elNextRing.style.borderColor = L.ring;
}
function spawnHeld(){
  held = { level: nextLevel, x: clamp(aimX, INSET + LEVELS[nextLevel].r, W - INSET - LEVELS[nextLevel].r) };
  nextLevel = randLevel();
  updateNextUI();
}
function drop(){
  if (!held || paused || world.state.over || cooldown > 0) return;
  var r = LEVELS[held.level].r;
  var x = clamp(held.x, INSET + r, W - INSET - r);
  world.add(held.level, x, DROP_Y, 0, 260);
  Sound.drop();
  held = null;
  cooldown = 0.36;
}
function restart(){
  world.reset();
  parts.length = 0; texts.length = 0; rings.length = 0;
  held = null; cooldown = 0; paused = false; shake = 0;
  nextLevel = randLevel(); updateNextUI();
  overlay.classList.remove('on');
  elScore.textContent = '0';
}
function gameOver(){
  paused = true;
  Sound.over();
  elBest.textContent = best;
  document.getElementById('ovScore').textContent = world.state.score;
  document.getElementById('ovMax').textContent = world.state.maxLevel ? ('Lv.' + (world.state.maxLevel + 1)) : '-';
  document.getElementById('ovMerge').textContent = world.state.merges;
  document.getElementById('ovBest').textContent = '历史最高：' + best;
  overlay.classList.add('on');
}

/* ============================== 输入 ============================== */
function toLocalX(clientX){
  var r = cv.getBoundingClientRect();
  return (clientX - r.left) * (W / r.width);
}
function aim(clientX){
  aimX = clamp(toLocalX(clientX), 0, W);
  if (held){
    var rr = LEVELS[held.level].r;
    held.x = clamp(aimX, INSET + rr, W - INSET - rr);
  }
}
cv.addEventListener('pointerdown', function(e){
  e.preventDefault();
  Sound.unlock();
  pointerType = e.pointerType || 'mouse';
  dragging = true;
  try { cv.setPointerCapture(e.pointerId); } catch (err){}
  aim(e.clientX);
  if (pointerType === 'mouse') { dropSafe(); }
});
cv.addEventListener('pointermove', function(e){
  if (pointerType === 'mouse' || dragging) aim(e.clientX);
});
cv.addEventListener('pointerup', function(e){
  if (e.pointerType !== 'mouse'){ aim(e.clientX); dropSafe(); }
  dragging = false;
});
cv.addEventListener('pointercancel', function(){ dragging = false; });
cv.addEventListener('touchstart', function(e){ e.preventDefault(); }, { passive: false });
cv.addEventListener('contextmenu', function(e){ e.preventDefault(); });

function dropSafe(){ try { drop(); } catch (err){ console.error(err); } }

window.addEventListener('keydown', function(e){
  var r = held ? LEVELS[held.level].r : 20;
  if (e.key === 'ArrowLeft'){ aimX = clamp(aimX - 22, 0, W); if (held) held.x = clamp(aimX, INSET + r, W - INSET - r); e.preventDefault(); }
  else if (e.key === 'ArrowRight'){ aimX = clamp(aimX + 22, 0, W); if (held) held.x = clamp(aimX, INSET + r, W - INSET - r); e.preventDefault(); }
  else if (e.key === ' ' || e.key === 'Enter'){ Sound.unlock(); dropSafe(); e.preventDefault(); }
  else if (e.key === 'r' || e.key === 'R'){ restart(); }
});
document.getElementById('btnRestart').addEventListener('click', restart);
document.getElementById('ovBtn').addEventListener('click', restart);
document.getElementById('btnSound').addEventListener('click', function(){
  var on = Sound.toggle();
  this.textContent = on ? '🔊 音效' : '🔇 静音';
});

/* ============================== 自适应尺寸 ============================== */
var scale = 1, cssW = W, cssH = H;
function fit(){
  var box = stage.getBoundingClientRect();
  var availW = box.width, availH = box.height;
  if (availW <= 0 || availH <= 0) return;
  var s = Math.min(availW / W, availH / H);
  // 画布实际像素尺寸 × DPR，保证清晰
  var dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cssW = Math.floor(W * s); cssH = Math.floor(H * s);
  cv.style.width = cssW + 'px'; cv.style.height = cssH + 'px';
  cv.width = Math.max(1, Math.floor(cssW * dpr));
  cv.height = Math.max(1, Math.floor(cssH * dpr));
  scale = cv.width / W;
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
}
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', function(){ setTimeout(fit, 120); });

/* ============================== 特效 ============================== */
var PALETTE = ['#ff5d73', '#ff9f1c', '#ffe066', '#a3e635', '#4cc9f0', '#8b5cf6', '#f472b6', '#22d3ee', '#facc15', '#fb7185', '#34d399'];
function burst(x, y, level, n){
  var col = PALETTE[Math.min(level, PALETTE.length - 1)];
  for (var i = 0; i < n; i++){
    var a = Math.random() * Math.PI * 2, sp = 90 + Math.random() * 320;
    parts.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
                 r: 2 + Math.random() * 4.5, life: 0.5 + Math.random() * 0.5, t: 0, col: col });
  }
  rings.push({ x: x, y: y, t: 0, life: 0.42, col: col, r0: LEVELS[Math.min(level, MAX_LV)].r * 0.6 });
  shake = Math.min(14, shake + 2 + level * 0.75);
}
function popText(x, y, txt, col){ texts.push({ x: x, y: y, txt: txt, col: col, t: 0, life: 0.95 }); }

/* ============================== 主循环 ============================== */
function drainEvents(){
  var ev = world.state.events, i;
  for (i = 0; i < ev.length; i++){
    var e = ev[i];
    if (e.done) continue;
    e.done = true;
    if (e.type === 'merge'){
      burst(e.x, e.y, e.level, 10 + e.level * 2);
      Sound.merge(e.level);
      var label = '+' + e.score + (e.combo > 1 ? '  x' + e.combo : '');
      popText(e.x, e.y - LEVELS[Math.min(e.level, MAX_LV)].r * 0.5, label, PALETTE[Math.min(e.level, PALETTE.length - 1)]);
    } else if (e.type === 'bigwin'){
      Sound.big(); shake = 18;
      for (var k = 0; k < 3; k++) burst(e.x + (Math.random() * 80 - 40), e.y + (Math.random() * 80 - 40), MAX_LV, 24);
      popText(e.x, e.y - 40, '大静子诞生！+500', '#ffe066');
    } else if (e.type === 'gameover'){
      var s = world.state.score;
      if (s > best){ best = s; try { localStorage.setItem('suika-face-best', String(best)); } catch (err){} }
      gameOver();
    }
  }
  ev.length = 0;
}

var acc = 0, last = performance.now();
function frame(now){
  var dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  time += dt;

  if (!paused){
    acc += dt;
    var guard = 0;
    while (acc >= 1 / 60 && guard++ < 5){ world.step(1 / 60); acc -= 1 / 60; }
    drainEvents();
    if (cooldown > 0){ cooldown -= dt; if (cooldown <= 0 && !held && !world.state.over) spawnHeld(); }
    if (!held && cooldown <= 0 && !world.state.over) spawnHeld();
  }
  // 如果暂停后重开，恢复
  if (world.state.over && !overlay.classList.contains('on')) gameOver();

  elScore.textContent = world.state.score;

  render(dt);
  requestAnimationFrame(frame);
}

function render(dt){
  var st = world.state;
  ctx.setTransform(scale, 0, 0, scale, 0, 0);

  // 背景
  var bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#151a2b');
  bg.addColorStop(0.45, '#0f1320');
  bg.addColorStop(1, '#0a0c14');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // 顶部落点区
  var tg = ctx.createLinearGradient(0, 0, 0, DANGER_Y);
  tg.addColorStop(0, 'rgba(99,230,190,.07)');
  tg.addColorStop(1, 'rgba(99,230,190,0)');
  ctx.fillStyle = tg;
  ctx.fillRect(0, 0, W, DANGER_Y);

  // 屏幕震动
  ctx.save();
  if (shake > 0.2){
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    shake *= Math.pow(0.0009, dt);
  } else shake = 0;

  // 容器
  ctx.save();
  ctx.lineWidth = 6;
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(255,255,255,.13)';
  ctx.beginPath();
  ctx.moveTo(INSET + 3, DANGER_Y - 14);
  ctx.lineTo(INSET + 3, H - 20);
  ctx.quadraticCurveTo(INSET + 3, H - INSET - 3, 20, H - INSET - 3);
  ctx.lineTo(W - 20, H - INSET - 3);
  ctx.quadraticCurveTo(W - INSET - 3, H - INSET - 3, W - INSET - 3, H - 20);
  ctx.lineTo(W - INSET - 3, DANGER_Y - 14);
  ctx.stroke();
  ctx.restore();

  // 死亡线
  var dangerK = Math.min(1, st.dangerTimer / 1.8);
  ctx.save();
  ctx.setLineDash([11, 9]);
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = dangerK > 0.02
    ? 'rgba(255,90,110,' + (0.45 + 0.5 * dangerK) + ')'
    : 'rgba(255,255,255,.16)';
  ctx.beginPath(); ctx.moveTo(INSET + 4, DANGER_Y); ctx.lineTo(W - INSET - 4, DANGER_Y); ctx.stroke();
  ctx.restore();
  if (dangerK > 0.02){
    var dg = ctx.createLinearGradient(0, 0, 0, DANGER_Y + 90);
    dg.addColorStop(0, 'rgba(255,60,90,' + (0.20 * dangerK) + ')');
    dg.addColorStop(1, 'rgba(255,60,90,0)');
    ctx.fillStyle = dg;
    ctx.fillRect(0, 0, W, DANGER_Y + 90);
  }

  // 瞄准参考线
  if (held && !st.over){
    ctx.save();
    ctx.setLineDash([6, 12]);
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(255,255,255,.13)';
    ctx.beginPath();
    ctx.moveTo(held.x, DROP_Y);
    ctx.lineTo(held.x, H - 8);
    ctx.stroke();
    ctx.restore();
  }

  // 表情包
  var bs = st.bodies, i, b;
  for (i = 0; i < bs.length; i++){
    b = bs[i];
    var L = LEVELS[b.level];
    var popK = b.pop > 0 ? b.pop / 0.3 : 0;
    var sc = 1 + 0.26 * popK;
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(b.angle);
    ctx.scale(sc, sc);
    // 光晕
    ctx.beginPath(); ctx.arc(0, 0, b.r * 1.02, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.fill();
    ctx.drawImage(sprites[b.level], -b.r, -b.r, b.r * 2, b.r * 2);
    // 圆环
    ctx.beginPath(); ctx.arc(0, 0, b.r - 1, 0, Math.PI * 2);
    ctx.lineWidth = Math.max(1.6, b.r * 0.075);
    ctx.strokeStyle = L.ring;
    ctx.stroke();
    // 高光
    ctx.beginPath();
    ctx.arc(0, 0, b.r - ctx.lineWidth, Math.PI * 1.15, Math.PI * 1.72);
    ctx.lineWidth = Math.max(1, b.r * 0.05);
    ctx.strokeStyle = 'rgba(255,255,255,.35)';
    ctx.stroke();
    // 等级角标
    if (b.r >= 26){
      var ax = b.r * 0.66, ay = b.r * 0.66;
      ctx.beginPath(); ctx.arc(ax, ay, Math.max(9, b.r * 0.24), 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(8,10,16,.72)'; ctx.fill();
      ctx.lineWidth = 1.5; ctx.strokeStyle = L.ring; ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.font = '700 ' + Math.max(11, b.r * 0.30).toFixed(0) + 'px system-ui, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(String(b.level + 1), ax, ay + 0.5);
    }
    ctx.restore();
  }

  // 待投放的表情
  if (held && !st.over){
    var lr = LEVELS[held.level].r;
    var bob = Math.sin(time * 3.4) * 2.5;
    ctx.save();
    ctx.translate(held.x, DROP_Y + bob);
    ctx.beginPath(); ctx.arc(0, 0, lr + 9, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,.06)'; ctx.fill();
    ctx.drawImage(sprites[held.level], -lr, -lr, lr * 2, lr * 2);
    ctx.beginPath(); ctx.arc(0, 0, lr - 1, 0, Math.PI * 2);
    ctx.lineWidth = Math.max(1.6, lr * 0.075);
    ctx.strokeStyle = LEVELS[held.level].ring; ctx.stroke();
    ctx.restore();
  }

  // 冲击波
  var rg = rings, k;
  for (k = rg.length - 1; k >= 0; k--){
    var r0 = rg[k];
    r0.t += dt;
    var p = r0.t / r0.life;
    if (p >= 1){ rg.splice(k, 1); continue; }
    ctx.beginPath();
    ctx.arc(r0.x, r0.y, r0.r0 + p * 78, 0, Math.PI * 2);
    ctx.lineWidth = 3.5 * (1 - p);
    ctx.strokeStyle = r0.col;
    ctx.globalAlpha = 0.75 * (1 - p);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // 粒子
  var pa = parts;
  for (k = pa.length - 1; k >= 0; k--){
    var q = pa[k];
    q.t += dt;
    if (q.t >= q.life){ pa.splice(k, 1); continue; }
    q.vy += 900 * dt;
    q.x += q.vx * dt; q.y += q.vy * dt;
    var a2 = 1 - q.t / q.life;
    ctx.globalAlpha = a2;
    ctx.beginPath();
    ctx.arc(q.x, q.y, q.r * (0.4 + a2 * 0.6), 0, Math.PI * 2);
    ctx.fillStyle = q.col; ctx.fill();
    ctx.globalAlpha = 1;
  }

  // 飘字
  var tx = texts;
  for (k = tx.length - 1; k >= 0; k--){
    var t0 = tx[k];
    t0.t += dt;
    if (t0.t >= t0.life){ tx.splice(k, 1); continue; }
    var p2 = t0.t / t0.life;
    ctx.globalAlpha = 1 - p2 * p2;
    ctx.font = '800 26px system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.55)';
    ctx.strokeText(t0.txt, t0.x, t0.y - p2 * 52);
    ctx.fillStyle = t0.col;
    ctx.fillText(t0.txt, t0.x, t0.y - p2 * 52);
    ctx.globalAlpha = 1;
  }

  // 危险提示
  if (st.dangerTimer > 0.25 && !st.over){
    ctx.globalAlpha = Math.min(0.85, 0.35 + 0.5 * dangerK) * (0.6 + 0.4 * Math.sin(time * 12));
    ctx.font = '800 22px system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillStyle = '#ff6b81';
    ctx.fillText('危险！快合掉它', W / 2, DANGER_Y + 12);
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

/* ============================== 启动 ============================== */
function boot(){
  var loaded = 0;
  faces = new Array(SPRITE_DATA.length);
  SPRITE_DATA.forEach(function(src, idx){
    var im = new Image();
    im.onload = function(){
      faces[idx] = im;
      if (++loaded === SPRITE_DATA.length){
        for (var i = 0; i < LEVELS.length; i++) sprites[i] = makeSprite(faces[LEVELS[i].img], LEVELS[i].hue);
        restart();
        fit();
        requestAnimationFrame(frame);
      }
    };
    im.onerror = function(){
      // 兜底：用纯色圆代替
      var c = document.createElement('canvas'); c.width = c.height = 8;
      var g = c.getContext('2d'); g.fillStyle = '#7a8194'; g.fillRect(0, 0, 8, 8);
      var fake = { width: 8, height: 8, _c: c };
      faces[idx] = fake;
      if (++loaded === SPRITE_DATA.length){
        for (var i = 0; i < LEVELS.length; i++) sprites[i] = makeSprite(faces[LEVELS[i].img], LEVELS[i].hue);
        restart(); fit(); requestAnimationFrame(frame);
      }
    };
    im.src = src;
  });
}
boot();

/* 调试/自动化测试钩子（不影响玩法，控制台里也能用：SUIKA.state / SUIKA.restart()） */
window.SUIKA = {
  get state(){ return world.state; },
  get paused(){ return paused; },
  get aimX(){ return aimX; },
  get held(){ return held; },
  get best(){ return best; },
  add: function(level, x, y){ return world.add(level, x, y, 0, 0); },
  drop: drop, restart: restart, LEVELS: LEVELS, W: W, H: H, DANGER_Y: DANGER_Y,
  canvas: cv, sprites: function(){ return SPRITE_DATA.length; }
};
})();
</script>
